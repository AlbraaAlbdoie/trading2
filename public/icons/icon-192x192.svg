<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <rect width="190" height="190" x="1" y="1" rx="39" fill="none" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Radar Ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="96" cy="96" r="44" fill="none" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Glowing Alpha / Nexus Symbol -->
  <path d="M 64 132 L 96 52 L 128 132 M 76 104 L 116 104" 
        fill="none" 
        stroke="url(#neon)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>
        
  <!-- Center Energy Dot -->
  <circle cx="96" cy="78" r="5" fill="#10B981" filter="url(#glow)"/>
</svg>
