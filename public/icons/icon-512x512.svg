<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="neon512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg512)"/>
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#1E293B" stroke-width="4"/>
  
  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="3"/>

  <!-- Glowing Alpha / Nexus Symbol -->
  <path d="M 170 350 L 256 140 L 342 350 M 202 276 L 310 276" 
        fill="none" 
        stroke="url(#neon512)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow512)"/>
        
  <!-- Center Energy Dot -->
  <circle cx="256" cy="210" r="12" fill="#10B981" filter="url(#glow512)"/>
</svg>
